services:
  - type: web
    name: domain-specific-rag-assistant
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    dockerfilePath: Dockerfile
    envVars:
      - key: DOMAIN_NAME
        value: "Company Policy Assistant"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: EMBEDDING_MODEL
        value: nemotron-3-embed-1b
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: VECTOR_PROVIDER
        value: qdrant
      - key: QDRANT_URL
        value: http://localhost:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: LLM_TIMEOUT
        value: "120"
      - key: LLM_MAX_TOKENS
        value: "2500"
      - key: LLM_TEMPERATURE
        value: "0.2"
