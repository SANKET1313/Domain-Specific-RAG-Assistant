# Fly.io configuration for Domain RAG FastAPI Backend
# Deploy with: fly deploy --config fly.backend.toml

app = "domain-rag-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DOMAIN_NAME = "Company Policy Assistant"
  NVIDIA_MODEL = "meta/llama-3.2-11b-vision-instruct"
  EMBEDDING_MODEL = "nemotron-3-embed-1b"
  EMBEDDING_PROVIDER = "nvidia"
  VECTOR_PROVIDER = "qdrant"
  MAX_UPLOAD_MB = "200"
  LLM_TIMEOUT = "120"
  LLM_MAX_TOKENS = "2500"
  LLM_TEMPERATURE = "0.2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Optional persistent volume for local Qdrant vectors
# Create with: fly volumes create rag_storage --size 1 --config fly.backend.toml
[mounts]
  source = "rag_storage"
  destination = "/app/qdrant_storage"
  initial_size = "1gb"
